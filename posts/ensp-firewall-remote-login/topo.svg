<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect width="920" height="430" fill="#f8fafc" rx="12"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">eNSP 远程管理防火墙实验拓扑</text>

  <!-- 真实主机 -->
  <rect x="40" y="150" width="200" height="130" rx="10" fill="#ffffff" stroke="#49b1f5" stroke-width="2"/>
  <rect x="40" y="150" width="200" height="34" rx="10" fill="#49b1f5"/>
  <rect x="40" y="172" width="200" height="12" fill="#49b1f5"/>
  <text x="140" y="173" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">真实主机</text>
  <text x="140" y="212" text-anchor="middle" font-size="13" fill="#2c3e50">IP: 192.168.0.2/24（桥接管理网段）</text>
  <text x="140" y="236" text-anchor="middle" font-size="13" fill="#2c3e50">IP: 10.1.1.2/24（业务网段）</text>
  <text x="140" y="262" text-anchor="middle" font-size="12" fill="#7f8c9b">浏览器 / PuTTY / ssh 命令</text>

  <!-- Cloud -->
  <ellipse cx="360" cy="215" rx="62" ry="45" fill="#fff7e6" stroke="#f5a623" stroke-width="2"/>
  <text x="360" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#b26a00">Cloud</text>
  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#b26a00">桥接网卡</text>

  <!-- 防火墙 -->
  <rect x="520" y="120" width="260" height="190" rx="10" fill="#ffffff" stroke="#e74c3c" stroke-width="2.5"/>
  <rect x="520" y="120" width="260" height="36" rx="10" fill="#e74c3c"/>
  <rect x="520" y="144" width="260" height="12" fill="#e74c3c"/>
  <text x="650" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">USG6000V 防火墙</text>
  <rect x="540" y="170" width="220" height="52" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-dasharray="4 3"/>
  <text x="650" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">GE0/0/0 管理口（默认）</text>
  <text x="650" y="210" text-anchor="middle" font-size="13" fill="#c0392b">IP: 192.168.0.1/24</text>
  <rect x="540" y="234" width="220" height="52" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-dasharray="4 3"/>
  <text x="650" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">GE1/0/1 业务口（新配）</text>
  <text x="650" y="274" text-anchor="middle" font-size="13" fill="#c0392b">IP: 10.1.1.1/24</text>

  <!-- 连线 -->
  <line x1="240" y1="200" x2="298" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="235" x2="298" y2="228" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="422" y1="208" x2="520" y2="195" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="422" y1="228" x2="520" y2="260" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 说明 -->
  <text x="298" y="180" font-size="12" fill="#7f8c9b">https://192.168.0.1:8443</text>
  <text x="300" y="256" font-size="12" fill="#7f8c9b">Web / SSH / Telnet</text>
  <text x="452" y="180" font-size="12" fill="#7f8c9b">Web 登录</text>
  <text x="448" y="252" font-size="12" fill="#7f8c9b">SSH / Telnet</text>

  <!-- 底部提示 -->
  <rect x="40" y="330" width="840" height="66" rx="8" fill="#eef7ff" stroke="#49b1f5" stroke-dasharray="5 3"/>
  <text x="60" y="356" font-size="13" fill="#2c3e50">要点：GE0/0/0 出厂即有 IP，用于首次 Web 登录；GE1/0/1 是新规划的业务口，</text>
  <text x="60" y="378" font-size="13" fill="#2c3e50">配完 IP 后必须 service-manage 放行 + trust→local 安全策略，远程管理才通。</text>
</svg>
